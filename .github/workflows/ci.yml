name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hospital-bulk .
      - name: Start container and check health
        run: |
          docker run -d -p 8000:8000 --name app hospital-bulk
          for i in $(seq 1 20); do curl -fs http://localhost:8000/ && exit 0; sleep 1; done
          docker logs app; exit 1
